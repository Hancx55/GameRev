<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/styles.css">
        <script src="/javascript/javascript.js" defer></script>
        <script src="/javascript/game.js" defer></script>
        <title> GAMEREV! </title>

        <!--main font-->
        <!--title font-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Jersey+10&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="content">
            <header></header>

            <section id="gameInformationPage">
                <div id="mainGame">
                    <div id="gameImgContainer">
                        <img id=gameImg src="/images/imageFiller.png" alt="games cover">
                    </div>

                    <div id="mainGameInfo">
                        <div id="gameInfoRow1">
                            <div id="gameDetails">
                                <h1 id="gameName"></h1>
                                <p id="gameDesc"></p>
                            </div>

                            <div id="gamePageBtns">
                                <button>Played</button>
                                <button>Playing</button>
                                <button>Wishlist</button>
                            </div>
                        </div>

                        <div id="gameInfoRow2">
                            <div id="gamePlatformInfo">
                                <h2>Platforms</h2>
                                <ul id="gamePlatforms">
                                </ul>
                            </div>

                            <div id="gameMetadata">
                                <div class="metaData">
                                    <span class="metaTitle">Developer</span>
                                    <span class="metaResult" id="devResult"></span>
                                </div>
                                <div class="metaData">
                                    <span class="metaTitle">Publisher</span>
                                    <span class="metaResult" id="pubResult"></span>
                                </div>
                                <div class="metaData">
                                    <span class="metaTitle">Released</span>
                                    <span class="metaResult" id="relResult"></span>
                                </div>
                                <div class="metaData">
                                    <span class="metaTitle">Rating</span>
                                    <span class="metaResult" id="ratResult"></span>
                                </div>
                            </div>
                        </div>
                    </div>               
                </div>

                <!--further details upon scrolling-->
            </section>
            

        </div>
    </body>
</html>
